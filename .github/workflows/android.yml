name: Build Android

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Patch CMakeLists for Android
      run: |
        # Remove -march=native and -mtune=native from CMakeLists.txt so Android NDK doesn't crash
        sed -i 's/-march=native//g' CMakeLists.txt
        sed -i 's/-mtune=native//g' CMakeLists.txt

    - name: Configure CMake for Android
      run: |
        mkdir build_android && cd build_android
        cmake .. \
          -G "Ninja" \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
          -DANDROID_ABI="arm64-v8a" \
          -DANDROID_PLATFORM="android-24" \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build with Ninja
      run: |
        cmake --build build_android --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cataphract-android-arm64
        path: build_android/Cataphract
