name: Android

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Verify net.bin
        run: |
          ls -la eval/net.bin
          test -s eval/net.bin || { echo "eval/net.bin is empty"; exit 1; }
          size=$(stat -c%s eval/net.bin)
          echo "net.bin size: $size bytes"
          if [ "$size" -lt 100000 ]; then
            echo "eval/net.bin is suspiciously small — likely a Git LFS pointer"; exit 1
          fi

      - name: Install NDK r28
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: false

      - name: Configure (CMake)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-arm64 --config Release -j"$(nproc)"

      - name: Inspect binary
        run: file build-arm64/Cataphract

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cataphract-arm64-v8a
          path: build-arm64/Cataphract
          if-no-files-found: error
